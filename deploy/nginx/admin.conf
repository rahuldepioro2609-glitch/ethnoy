# ELTNOY ADMIN Nginx (P1-C): admin.eltnoy.in ONLY (private Admin domain; never the public eltnoy.com).
#
# Mounted by docker-compose.yml (P1-D.2) read-only as /etc/nginx/conf.d/default.conf in the separate
# ADMIN Nginx container (nginx_admin) only, with deploy/nginx/includes/ read-only at
# /etc/nginx/includes/. Statically tested only; not runtime-validated (P1-F). Never load it together
# with public.conf: both declare `default_server` on 8080 and 8443, so a combined load fails with a
# duplicate default server. (A duplicate `map` variable alone would NOT fail — the later map wins.)
# Reachability only over the WireGuard path, the host/interface binding, Docker networks and the
# proxy's static address (which must be configured in ELTNOY_ADMIN_PROXY_CIDRS, distinct from the
# public proxy) are P1-D/P1-F; nothing here is network isolation.

# Do not disclose the Nginx version in the Server header or on error pages.
server_tokens off;

# The API's ADMIN listener only: "app" is the network alias of api_admin on the internal admin_app
# network (the only API on that network), ADMIN_PORT default 4001
# (DEFAULT_LISTENER_PORTS.admin in server/surfaceEnforcement.ts). The public listener is never an
# upstream of this configuration.
upstream eltnoy_admin_listener {
    server app:4001;
}

# Validated original host: exactly admin.eltnoy.in, case-insensitive, without a port. Anything
# else maps to "" and is rejected.
map $http_host $eltnoy_original_host {
    default "";
    "~*^admin\.eltnoy\.in$" "admin.eltnoy.in";
}

# ---------------------------------------------------------------------------
# HTTP (8080): unknown hosts are dropped; the Admin host redirects to HTTPS. Nothing is proxied.
# ---------------------------------------------------------------------------

server {
    listen 8080 default_server;
    server_name _;

    # Nginx-local liveness probe for a container health check (P1-D): loopback only, answered by
    # Nginx itself and never proxied. It is not the API health endpoint.
    location = /_internal-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen 8080;
    server_name admin.eltnoy.in;
    if ($eltnoy_original_host != "admin.eltnoy.in") {
        return 421;
    }
    location / {
        return 301 https://admin.eltnoy.in$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS (8443): unknown SNI is refused at the handshake; only admin.eltnoy.in is proxied, and only
# to the Admin listener.
# ---------------------------------------------------------------------------

server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 8443 ssl;
    server_name admin.eltnoy.in;
    include /etc/nginx/includes/eltnoy-tls.conf;
    if ($eltnoy_original_host != "admin.eltnoy.in") {
        return 421;
    }
    location / {
        include /etc/nginx/includes/eltnoy-proxy.conf;
        proxy_pass http://eltnoy_admin_listener;
    }
}
