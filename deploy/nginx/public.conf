# ELTNOY PUBLIC Nginx (P1-C): public site hostnames only; www redirects to canonical apex.
#
# Mounted by docker-compose.yml (P1-D.2) read-only as /etc/nginx/conf.d/default.conf in the PUBLIC
# Nginx container (nginx_public) only, with deploy/nginx/includes/ read-only at /etc/nginx/includes/.
# Statically tested only; not runtime-validated (P1-F). Never load it together with admin.conf: both
# declare `default_server` on 8080 and 8443, so a combined load fails with a duplicate default server
# instead of mixing surfaces. (A duplicate `map` variable alone would NOT fail — the later map wins.)
# Docker networks, host/interface bindings and the proxy's static address (which must be configured
# in ELTNOY_PUBLIC_PROXY_CIDRS) are P1-D/P1-F; nothing here is network isolation.

# Do not disclose the Nginx version in the Server header or on error pages.
server_tokens off;

# The API's PUBLIC listener only: "app" is the network alias of api_public on the internal public_app
# network (the only API on that network), PORT default 4000
# (DEFAULT_LISTENER_PORTS.public in server/surfaceEnforcement.ts). The Admin listener is never an
# upstream of this configuration.
upstream eltnoy_public_listener {
    server app:4000;
}

# Validated original host: the exact allow-listed public hostnames, case-insensitive, without a
# port. Unknown, port-qualified, multi-valued or empty Host values map to "" and are rejected.
map $http_host $eltnoy_original_host {
    default "";
    "~*^eltnoy\.com$" "eltnoy.com";
    "~*^www\.eltnoy\.com$" "www.eltnoy.com";
    "~*^exam\.eltnoy\.com$" "exam.eltnoy.com";
    "~*^institution\.eltnoy\.com$" "institution.eltnoy.com";
}

# ---------------------------------------------------------------------------
# HTTP (8080): unknown hosts are dropped; known hosts redirect to HTTPS. Nothing is proxied.
# ---------------------------------------------------------------------------

server {
    listen 8080 default_server;
    server_name _;

    # Nginx-local liveness probe for a container health check (P1-D): loopback only, answered by
    # Nginx itself and never proxied. It is not the API health endpoint (/api/health is
    # internal to the API container in P1-B and is never exposed through a hostname).
    location = /_internal-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen 8080;
    server_name eltnoy.com;
    if ($eltnoy_original_host != "eltnoy.com") {
        return 421;
    }
    location / {
        return 301 https://eltnoy.com$request_uri;
    }
}

server {
    listen 8080;
    server_name www.eltnoy.com;
    if ($eltnoy_original_host != "www.eltnoy.com") {
        return 421;
    }
    location / {
        return 301 https://eltnoy.com$request_uri;
    }
}

server {
    listen 8080;
    server_name exam.eltnoy.com;
    if ($eltnoy_original_host != "exam.eltnoy.com") {
        return 421;
    }
    location / {
        return 301 https://exam.eltnoy.com$request_uri;
    }
}

server {
    listen 8080;
    server_name institution.eltnoy.com;
    if ($eltnoy_original_host != "institution.eltnoy.com") {
        return 421;
    }
    location / {
        return 301 https://institution.eltnoy.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS (8443): unknown SNI is refused at the handshake; a request whose Host is not an allow-listed
# public hostname is dropped; each hostname server proxies only to the public listener.
# ---------------------------------------------------------------------------

server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 8443 ssl;
    server_name eltnoy.com;
    include /etc/nginx/includes/eltnoy-tls.conf;
    if ($eltnoy_original_host != "eltnoy.com") {
        return 421;
    }
    location / {
        include /etc/nginx/includes/eltnoy-proxy.conf;
        proxy_pass http://eltnoy_public_listener;
    }
}

server {
    listen 8443 ssl;
    server_name www.eltnoy.com;
    include /etc/nginx/includes/eltnoy-tls.conf;
    if ($eltnoy_original_host != "www.eltnoy.com") {
        return 421;
    }
    location / {
        return 301 https://eltnoy.com$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name exam.eltnoy.com;
    include /etc/nginx/includes/eltnoy-tls.conf;
    if ($eltnoy_original_host != "exam.eltnoy.com") {
        return 421;
    }
    location / {
        include /etc/nginx/includes/eltnoy-proxy.conf;
        proxy_pass http://eltnoy_public_listener;
    }
}

server {
    listen 8443 ssl;
    server_name institution.eltnoy.com;
    include /etc/nginx/includes/eltnoy-tls.conf;
    if ($eltnoy_original_host != "institution.eltnoy.com") {
        return 421;
    }
    location / {
        include /etc/nginx/includes/eltnoy-proxy.conf;
        proxy_pass http://eltnoy_public_listener;
    }
}
