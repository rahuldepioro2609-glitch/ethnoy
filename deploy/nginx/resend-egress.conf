# Resend egress proxy (service resend_egress in docker-compose.yml). Replaces /etc/nginx/nginx.conf.
#
# api_public sits only on internal networks and has no route to the internet. Verification emails
# leave through this proxy, which forwards raw TLS (no termination: it never sees the API key, the
# recipient or the code) and ONLY when the client asked for api.resend.com (TLS SNI). Every other
# name is sent to a closed local port, so the connection fails. The destination is fixed here; the
# client cannot choose it.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 128;
}

stream {
  # Docker's embedded DNS (this container also sits on the non-internal email_egress network).
  resolver 127.0.0.11 valid=300s ipv6=off;
  resolver_timeout 5s;

  # Connection metadata only (no payload exists in the clear).
  log_format egress '$time_iso8601 client=$remote_addr sni=$ssl_preread_server_name upstream=$upstream_addr status=$status sent=$bytes_sent received=$bytes_received';
  access_log /dev/stdout egress;

  map $ssl_preread_server_name $egress_upstream {
    api.resend.com api.resend.com:443;
    default        127.0.0.1:1;
  }

  server {
    listen 8443;
    ssl_preread on;
    preread_timeout 5s;
    proxy_pass $egress_upstream;
    proxy_connect_timeout 5s;
    proxy_timeout 30s;
  }
}
