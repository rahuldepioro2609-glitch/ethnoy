# ELTNOY TLS policy for hostname servers (P1-C). Preserves the existing deployment pattern:
# certificate files mounted read-only at /etc/nginx/tls (Compose TLS_CERT_DIR). Whether a
# certificate covers every hostname of a configuration is NOT established here: certificates,
# split-horizon DNS and the Admin certificate are separately approved P1-D/P1-F work.
ssl_certificate /etc/nginx/tls/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;

add_header Strict-Transport-Security "max-age=31536000" always;
