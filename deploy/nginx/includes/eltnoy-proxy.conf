# ELTNOY trusted forwarding policy (P1-C). Included INSIDE every proxied location of public.conf and
# admin.conf, so each location carries the complete header set itself and never depends on Nginx
# proxy_set_header inheritance (a location that sets any proxy_set_header inherits none).
#
# $eltnoy_original_host is produced by the allow-list map of the including configuration and has
# already been checked to equal the server's own hostname; it is never a raw client value.

proxy_http_version 1.1;

# Host and forwarded host: the validated original host only (client X-Forwarded-Host is replaced).
proxy_set_header Host $eltnoy_original_host;
proxy_set_header X-Forwarded-Host $eltnoy_original_host;
# Scheme of the connection this Nginx accepted.
proxy_set_header X-Forwarded-Proto $scheme;
# OVERWRITTEN with the direct client address seen by this Nginx — never appended to a
# client-supplied chain ($proxy_add_x_forwarded_for is deliberately not used).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# Surface selection input for the API gate (P1-B), overwritten on every request.
proxy_set_header X-ELTNOY-Original-Host $eltnoy_original_host;

# Strip client-supplied internal identity and alternative forwarding headers (an empty value
# removes the header from the upstream request). Listener identity is assigned by the API's
# server-side wiring, never by a header.
proxy_set_header X-ELTNOY-Listener "";
proxy_set_header X-ELTNOY-Surface "";
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
# No connection upgrades (the API serves no WebSocket routes).
proxy_set_header Upgrade "";
proxy_set_header Connection "";

proxy_read_timeout 120s;
client_max_body_size 6m;
